<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#093f3c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle medical grid / biomechanics accent line -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2dd4bf" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Main Functional Movement / Spine / Shield Glyph -->
  <g filter="url(#shadow)">
    <!-- Central Biomechanical Spine / Kinetic Motion Arc -->
    <!-- Stylized kinetic figure & rehabilitation wave -->
    <path d="M256 128 C267 128 276 137 276 148 C276 159 267 168 256 168 C245 168 236 159 236 148 C236 137 245 128 256 128 Z" fill="url(#accentGrad)" />

    <!-- Kinetic vertebral curve -->
    <path d="M256 182 C286 182 318 200 324 236 C328 262 312 284 290 298 C266 314 246 332 248 358 C249 374 256 384 256 384"
          fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic Counter Arc (Functional movement & stability) -->
    <path d="M192 230 C204 200 232 188 256 188"
          fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="18" stroke-linecap="round" />

    <path d="M256 330 C230 330 200 310 194 278 C190 254 202 236 216 224"
          fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round" />

    <!-- Clinical cross accent dots / alignment nodes -->
    <circle cx="256" cy="216" r="9" fill="#ffffff" />
    <circle cx="274" cy="260" r="9" fill="#ffffff" />
    <circle cx="248" cy="308" r="9" fill="url(#accentGrad)" />
    <circle cx="254" cy="356" r="9" fill="#ffffff" />

    <!-- Functional Labs "F" & "R" movement wings -->
    <path d="M168 256 L150 256" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M362 256 L344 256" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
